# Railway — Config as Code (https://docs.railway.com/reference/config-as-code)
# Deploy:  cd 06-lab-complete && railway up
# Biến môi trường đặt trên Railway (không ghi ở đây):
#   AGENT_API_KEY, REDIS_URL (tham chiếu tới Redis của project), ENVIRONMENT=production
# PORT do Railway tự cấp — CMD trong Dockerfile đã nghe theo ${PORT}.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 60
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
