# Render Blueprint (https://render.com/docs/blueprint-spec)
# Render → New → Blueprint → chọn repo, Blueprint path: 06-lab-complete/render.yaml
services:
  - type: web
    name: day14-agent
    runtime: docker
    rootDir: 06-lab-complete
    dockerfilePath: ./Dockerfile
    plan: free
    region: singapore
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: RATE_LIMIT_PER_MINUTE
        value: "10"
      - key: DAILY_BUDGET_USD
        value: "1.0"
      - key: AGENT_API_KEY
        generateValue: true        # Render tự sinh chuỗi ngẫu nhiên, không ghi giá trị trong git
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: day14-redis
          property: connectionString

  - type: keyvalue                 # Redis-compatible (Render Key Value)
    name: day14-redis
    plan: free
    region: singapore
    ipAllowList: []                # chỉ cho phép kết nối nội bộ từ các service trong Render
    maxmemoryPolicy: noeviction    # không tự xoá key rate limit / cost khi đầy bộ nhớ
