# ============================================================
# Agent + Redis bằng một lệnh:   docker compose up --build
#   • Secret (AGENT_API_KEY) đọc từ file .env (không commit) — không ghi trong file này
#   • agent chỉ start khi Redis đã healthy
# ============================================================
services:
  agent:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false          # không có .env vẫn chạy được (khi đó auth từ chối mọi request)
    environment:
      - PORT=8000
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]   # bật AOF: restart Redis không mất state
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  redis_data:
